<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SWB — настройка ориентации и центрирования моделей</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141d;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #cfd8e6; }
  #scene { position: absolute; inset: 0; }
  #panel { position: absolute; right: 14px; top: 14px; width: 300px; z-index: 5;
    background: rgba(4, 8, 14, 0.85); border: 1px solid rgba(113, 238, 160, 0.22);
    border-radius: 8px; padding: 12px; font-size: 12px; }
  #panel h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em; color: #8fd0ff; }
  #panel select { width: 100%; background: #0b1220; color: #cfd8e6; border: 1px solid #2a3a55;
    border-radius: 4px; padding: 4px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .row label { width: 92px; color: #8fa0b8; }
  .row input[type="range"] { flex: 1; accent-color: #3ec8ff; }
  .row .val { width: 56px; text-align: right; }
  button { background: #14213a; color: #cfd8e6; border: 1px solid #2a3a55; border-radius: 4px;
    padding: 4px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: #3ec8ff; }
  button.primary { background: #1a3a2a; border-color: #4caf7d; color: #b7f0cf; width: 100%; margin-top: 8px; }
  .hint { color: #ffe082; font-size: 11px; margin: 6px 0; }
  #status { color: #8fa0b8; font-size: 11px; margin-top: 8px; white-space: pre-wrap; }
  input[type="number"] { width: 56px; background: #0b1220; color: #cfd8e6; border: 1px solid #2a3a55; border-radius: 4px; padding: 2px 4px; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="scene"></div>
<div id="panel">
  <h2>НАСТРОЙКА МОДЕЛЕЙ <span style="color:#4caf7d">v2</span></h2>
  <select id="pick"></select>
  <div class="hint">Жёлтый конус = нос (−Z). Шестиугольник = клетка поля. ПКМ — орбита, колесо — зум.</div>
  <div class="row"><label>rotY 90°</label>
    <button data-rot="-90">⟲</button><span id="rotY" class="val">0°</span><button data-rot="90">⟳</button></div>
  <div class="row"><label>курс Y</label>
    <input type="range" id="fine" min="-180" max="180" step="1" value="0"><span id="fineV" class="val">0°</span></div>
  <div class="row"><label>тангаж X</label>
    <input type="range" id="rotX" min="-180" max="180" step="1" value="0"><span id="rotXV" class="val">0°</span></div>
  <div class="row"><label>крен Z</label>
    <input type="range" id="rotZ" min="-180" max="180" step="1" value="0"><span id="rotZV" class="val">0°</span></div>
  <div class="row"><label>сдвиг X</label>
    <input type="range" id="offX" min="-3" max="3" step="0.01" value="0"><span id="offXV" class="val">0.00</span></div>
  <div class="row"><label>сдвиг Z</label>
    <input type="range" id="offZ" min="-3" max="3" step="0.01" value="0"><span id="offZV" class="val">0.00</span></div>
  <div class="row"><label>масштаб</label>
    <input type="range" id="scale" min="0.3" max="3" step="0.01" value="1"><span id="scaleV" class="val">1.00</span></div>
  <div class="row"><label>вдоль носа</label>
    <input type="range" id="fwd" min="-3" max="3" step="0.01" value="0"><span id="fwdV" class="val">0.00</span></div>
  <div class="row"><label>подъём Y</label>
    <input type="range" id="offY" min="-0.3" max="0.5" step="0.01" value="0"><span id="offYV" class="val">0.00</span></div>
  <div class="row"><button id="reset">сброс</button><button id="copy">JSON в буфер</button></div>
  <button id="save" class="primary">СОХРАНИТЬ В index.json</button>
  <div id="status"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { createSchemGroup } from './schem_models.js';

const FOOT = {
  star_destroyer: { x: 0.56, z: 0.84 }, xwing_t65: { x: 0.68, z: 0.75 }, millennium_falcon: { x: 0.64, z: 0.88 },
  ghost: { x: 0.36, z: 0.86 }, slave_1: { x: 0.62, z: 0.78 }, tie_fighter: { x: 0.58, z: 0.50 },
  death_star_1: { x: 0.64, z: 0.64 },
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141d);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xbfd4ee, 0x2a2438, 1.6));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(6, 12, 5);
scene.add(sun);

// клетка-гекс для масштаба
scene.add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.865, 0.865, 0.06, 6),
  new THREE.MeshStandardMaterial({ color: 0x232c4a, roughness: 0.9 })
));
// маркер носа (-Z)
const nose = new THREE.Group();
const cone = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.45, 6), new THREE.MeshBasicMaterial({ color: 0xffe082 }));
cone.rotation.x = -Math.PI / 2;
cone.position.set(0, 0.15, -1.05);
nose.add(cone);
scene.add(nose);

window.__steps = ['imports-ok'];
try {
const params = new URLSearchParams(location.search);
const only = params.get('one');
window.__steps = window.__steps || [];
window.__steps.push('start');

let index = {};
try { index = await (await fetch('assets/models/meshes/index.json')).json(); } catch {}
window.__steps.push('index');

const records = new Map();
await Promise.all(Object.entries(index).map(async ([typeId, cfg0]) => {
  if (typeId.startsWith('_')) return;
  const cfg = typeof cfg0 === 'string' ? { file: cfg0 } : cfg0;
  if (!cfg || !cfg.file) return;
  try {
    const res = await fetch('assets/models/meshes/' + cfg.file);
    if (res.ok) records.set(typeId, await res.json());
  } catch {}
}));
window.__steps.push('loaded');

const pick = document.getElementById('pick');
let ids = Object.keys(index).filter(k => !k.startsWith('_') && records.has(k));
if (only) ids = ids.filter(k => k === only);
for (const id of ids) {
  const o = document.createElement('option');
  o.value = id; o.textContent = id;
  pick.appendChild(o);
}

let model = null, id = null;
let needRender = true, rebuildTimer = 0;
const $ = (x) => document.getElementById(x);

function rebuild() {
  clearTimeout(rebuildTimer);
  if (model) {
    scene.remove(model);
    model.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
  }
  model = createSchemGroup(records.get(id), id, cfg(), FOOT);
  scene.add(model);
  status('показан: ' + id + ' · ' + model.userData.schem.tris.toLocaleString('ru-RU') + ' треугольников');
  renderOnce();
}
function applyLive() {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, 32);
}
function cfg() {
  const c = index[id];
  return typeof c === 'string' ? (index[id] = { file: c }) : c;
}
function status(t) { $('status').textContent = t; }

function show(newId) {
  id = newId;
  pick.value = id;
  const c = cfg();
  $('rotY').textContent = (c.rotY || 0) + '°';
  $('fine').value = c.rotFine || 0; $('fineV').textContent = (c.rotFine || 0) + '°';
  $('rotX').value = c.rotX || 0; $('rotXV').textContent = (c.rotX || 0) + '°';
  $('rotZ').value = c.rotZ || 0; $('rotZV').textContent = (c.rotZ || 0) + '°';
  $('offX').value = c.offX || 0; $('offXV').textContent = (+(c.offX || 0)).toFixed(2);
  $('offZ').value = c.offZ || 0; $('offZV').textContent = (+(c.offZ || 0)).toFixed(2);
  $('scale').value = c.scale || 1; $('scaleV').textContent = (+(c.scale || 1)).toFixed(2);
  $('offY').value = c.offY || 0; $('offYV').textContent = (+(c.offY || 0)).toFixed(2);
  $('fwd').value = c.fwd || 0; $('fwdV').textContent = (+(c.fwd || 0)).toFixed(2);
  rebuild();
}

pick.addEventListener('change', () => show(pick.value));
document.querySelectorAll('[data-rot]').forEach(b => b.addEventListener('click', () => {
  const c = cfg();
  c.rotY = ((c.rotY || 0) + Number(b.dataset.rot) + 360) % 360;
  $('rotY').textContent = c.rotY + '°';
  rebuild();
}));
for (const [inp, key, out, fmt] of [
  ['fine', 'rotFine', 'fineV', 'deg'], ['rotX', 'rotX', 'rotXV', 'deg'], ['rotZ', 'rotZ', 'rotZV', 'deg'],
  ['offX', 'offX', 'offXV'], ['offZ', 'offZ', 'offZV'],
  ['scale', 'scale', 'scaleV'], ['offY', 'offY', 'offYV'], ['fwd', 'fwd', 'fwdV'],
]) {
  $(inp).addEventListener('input', () => {
    const c = cfg();
    c[key] = Number($(inp).value);
    $(out).textContent = fmt === 'deg' ? c[key] + '°' : (+c[key]).toFixed(2);
    applyLive();
  });
}
$('reset').addEventListener('click', () => {
  const c = cfg();
  for (const k of ['rotFine', 'rotX', 'rotZ', 'offX', 'offZ', 'offY', 'scale', 'fwd']) delete c[k];
  show(id);
});
$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify({ [id]: cfg() }, null, 1));
  status('скопировано: ' + JSON.stringify(cfg()));
});
$('save').addEventListener('click', async () => {
  const r = await fetch('/api/mesh-index', { method: 'POST', body: JSON.stringify(index, null, 1) });
  status(r.ok ? 'сохранено в index.json ✓ — в игре перезагрузить страницу' : 'ошибка сохранения: ' + r.status);
});

if (ids.length) show(ids[0]); else status('модели не загрузились');
window.__steps.push('shown');

const orbit = { theta: Math.PI / 2, phi: 0.6, dist: 4.5, target: new THREE.Vector3(0, 0.2, 0) };
function applyCamera() {
  camera.position.set(
    orbit.target.x + orbit.dist * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    orbit.target.y + orbit.dist * Math.cos(orbit.phi),
    orbit.target.z + orbit.dist * Math.sin(orbit.phi) * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
  needRender = true;
}
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag || drag.b !== 2) return;
  orbit.theta -= (e.clientX - drag.x) * 0.006;
  orbit.phi = Math.min(1.45, Math.max(0.15, orbit.phi - (e.clientY - drag.y) * 0.005));
  drag.x = e.clientX; drag.y = e.clientY;
  applyCamera();
});
addEventListener('wheel', (e) => {
  orbit.dist = Math.min(30, Math.max(1.5, orbit.dist * (1 + Math.sign(e.deltaY) * 0.1)));
  applyCamera();
}, { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  needRender = true;
});
function renderOnce() { renderer.render(scene, camera); needRender = false; }
window.__dbg = { scene, camera, renderer };
applyCamera();
renderOnce();
(function pump() { requestAnimationFrame(pump); if (needRender) renderOnce(); })();
window.__steps.push('done');
} catch (e) { window.__err = e.message + ' @ ' + (e.stack || '').split('\n')[1]; }
</script>
</body>
</html>
