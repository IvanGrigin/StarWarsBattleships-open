[package]
name = "game_core_wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for game_core: JSON-in/JSON-out API for the browser demo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game_core = { path = "../game_core" }
serde_json = "1"
# Must match the installed wasm-bindgen-cli version (0.2.128).
wasm-bindgen = "=0.2.128"
